# Cấu hình demo 4: Upstream + 20M
# Một worker giúp dễ quan sát các request gọi tuần tự trên lớp.
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format demo '$remote_addr "$request" status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status backend=$upstream_http_x_backend_id '
                    'time=$request_time';
    access_log /dev/stdout demo;
    sendfile on;
    keepalive_timeout 30;
    upstream luma_backend {
        zone luma_backend 64k;
        server backend1:8080 max_fails=1 fail_timeout=3s;
        server backend2:8080 max_fails=1 fail_timeout=3s;
    }

    server {
        listen 80;
        server_name luma.test localhost;
        client_max_body_size 20M;
        root /usr/share/nginx/html;
        index index.html;
        location /media/ {
            alias /srv/media/;
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=3600";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }
        location = /demo-stage.json {
            default_type application/json;
            add_header Cache-Control "no-store";
            return 200 '{"stage":4,"name":"Upstream + 20M","bodyLimit":"20M"}';
        }
        error_page 413 = @body_too_large;
        location @body_too_large {
            default_type application/json;
            return 413 '{"origin":"nginx","error":"NGINX blocked this request: client_max_body_size 20M"}';
        }

        location /api/ {
            # Không có / cuối: giữ nguyên /api/products khi gửi tới backend.
            proxy_pass http://luma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

    }
}
