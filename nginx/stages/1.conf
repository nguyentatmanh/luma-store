# Cấu hình demo 1: Web Server
# Một worker giúp dễ quan sát các request gọi tuần tự trên lớp.
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format demo '$remote_addr "$request" status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status backend=$upstream_http_x_backend_id '
                    'time=$request_time';
    access_log /dev/stdout demo;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 80;
        server_name luma.test localhost;
        client_max_body_size 1M;
        root /usr/share/nginx/html;
        index index.html;
        location /media/ {
            alias /srv/media/;
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=3600";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }
        location = /demo-stage.json {
            default_type application/json;
            add_header Cache-Control "no-store";
            return 200 '{"stage":1,"name":"Web Server","bodyLimit":"1M"}';
        }
        error_page 413 = @body_too_large;
        location @body_too_large {
            default_type application/json;
            return 413 '{"origin":"nginx","error":"NGINX blocked this request: client_max_body_size 1M"}';
        }

        location /api/ {
            default_type application/json;
            return 503 '{"origin":"nginx","error":"Stage 1 serves static files only. Switch to stage 2."}';
        }

    }
}
